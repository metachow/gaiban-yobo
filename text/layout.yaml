# Page geometry (mm), measured on the Tsukuba scans (12.41 px/mm; tools/measure_page.py).
# Page = catalogue size 182 x 251. Scan x positions are aligned on the fore-edge (the
# fold): right pages +10.5 mm (scan page 171.5 wide, the rest hides in the gutter).
layout:
  paper: [182, 251]
  top: 20.0            # first character, from the top edge
  height: 214.0        # 本文字高 21.5 cm (catalogue)
  col_pitch: 14.3
  spine_margin: 21.0   # omote (left page): column 1 centre from the spine edge
  fore_margin: 32.3    # ura (right page): column 1 centre from the fore-edge
  unit: 9.6            # natural advance of a kanji (katakana 0.8 of it)
  glyph: 8.9            # body font size
  ruby: 3.5
  note_scale: 0.55     # 割注 characters relative to the body
  justify: 0.85        # columns at least this full are justified to the full height

# Page styles (override `layout` for pages with `style:`)
styles:
  preface:             # 序: written 行草 -> 衡山毛筆フォント行書
    font: gyo
    top: 9.0
    height: 226.0
    col_pitch: 14.5
    unit: 7.8
    glyph: 8.2
  maptext:             # note beside the world map
    top: 17.0
    height: 214.0
    col_pitch: 8.8
    unit: 6.2
    glyph: 5.8
  naidai:              # 内題
    top: 23.0
    unit: 12.0
    glyph: 10.0

# Pages in reading order. side b = ura (right page of an opening), a = omote (left page).
