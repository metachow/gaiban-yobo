head_zh: 为匿亚（几内亚）
head_en: Goinea (Guinea)
zh: |
  为匿亚（几内亚）〔有上、下之分〕上几内亚在泥乂利西亚（尼格里提亚）的西南，下几内亚在黑地兀皮亚（埃塞俄比亚）[^1]的海滨，其疆界极为广大。全国分为数部，其首府称アボシイ（阿波美）[^2]。其人勇壮，风俗不一。古时隶属于波尔杜尾尔（葡萄牙）。近世暎咭唎（英国）、拂兰西（法国）、弟那玛尔加（丹麦）等也在此地设立商馆，进行管辖。气候炎热，出产各种物产。北极出地三度至十六度。
en: |
  Goinea (Guinea) 〔there is an upper and a lower〕. The upper one lies to the southwest of Nigirishia (Nigritia), and the lower one lies on the seashore of Echiopia (Ethiopia);[^1] its territory is extremely large. The whole country is divided into several parts, and its chief city is called Aboshii (Abomey).[^2] The people are brave, and their customs are not uniform. In ancient times it belonged to Horutogaru (Portugal). In recent times Igirisu (England), Furansu (France), Dēnemaruka (Denmark) and others have set up trading posts in this land as well and rule it. The climate is hot, and all kinds of things are produced. The pole stands three to sixteen degrees above the horizon.
notes_zh:
  - 黑地兀皮亚（埃塞俄比亚）：旧时对撒哈拉以南非洲的泛称，非今埃塞俄比亚国。
  - アボシイ：或为阿波美（达荷美王国的都城），未能确证。
notes_en:
  - "Echiopia (written with the character 黒, \"black\"): the old name for Africa south of the Sahara, not the modern state."
  - "Aboshii: perhaps Abomey, the capital of Dahomey; not certain."
