head_zh: 世界图说明
head_en: Note to the World Map
zh: |
  全世界图上只标出《外蕃容貌图画》所绘人物的国名；若要了解详情，可查看《坤舆界全图》[^1]。
en: |
  Only the names of the countries whose people are shown in *Illustrated Appearances of Foreign Peoples* are entered on the map of the whole world; for fuller detail one should consult the *Kon'yo kai zenzu*.[^1]
notes_zh:
  - 《坤舆界全图》：未能在此题名下查到；或指箕作省吾《新制舆地全图》（1844），即《坤舆图识》的姊妹图。
notes_en:
  - "*Kon'yo kai zenzu*: a book of this exact title has not been found; perhaps Mitsukuri Shōgo's *Shinsei yochi zenzu* (1844), the companion map of his *Kon'yo zushiki*."
