head_zh: 世界图说明
head_en: Note to the World Map
zh: |
  全世界图上只标出《外蕃容貌图画》所绘人物的国名；若要了解详情，可查看《坤舆略全图》[^1]。
en: |
  Only the names of the countries whose people are shown in *Illustrated Appearances of Foreign Peoples* are entered on the map of the whole world; for fuller detail one should consult the *Kon'yo ryaku zenzu*.[^1]
notes_zh:
  - "《坤舆略全图》：原文作“坤輿畧全圖”（“畧”即“略”）。当指柴田（新发田）收藏的世界地图，嘉永五年〔1852〕序，春草堂高木耕藏版，图题正作“新訂坤輿畧全圖”，与原文用字相同。"
notes_en:
  - "*Kon'yo ryaku zenzu* (坤輿畧全圖, 畧 = 略): evidently Shibata Shūzō's world map with a preface dated 1852, whose printed title reads 新訂坤輿畧全圖 with the same character 畧."
