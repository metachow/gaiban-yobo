head_zh: 新貌利太泥亚（英属北美）
head_en: Shinpuritania (British North America)
zh: |
  新貌利太泥亚（英属北美）〔一名ラプラトレ（拉布拉多）〕此国在合众国的东北，此地东部海岸有暎咭唎（英国）的大商馆。其人形体极小，手足如同他国十一二岁的孩童，天生才智极为短浅，据说数物品时数到二十以上，便已忘了前面的数目。又没有贵贱之别与法度之制〔世人所说的“小人”，大概就是这些人吧〕[^1]。气候严寒，物产匮乏，常以渔猎为业。北极出地四十四度至六十二度。
en: |
  Shinpuritania (British North America) 〔also called Rapuratore (Labrador)〕. This country lies to the northeast of the United States, and on the east coast of this land there is a great trading post of Igirisu (England). The people are extremely small in body, their hands and feet are like those of a child of eleven or twelve years in other countries, and their natural wit is extremely short: in counting things, once they come to more than twenty, they are said to have already forgotten the earlier numbers. Again, there is no distinction of noble and lowly and no regulation of law 〔perhaps these are what the world calls "small people"〕.[^1] The climate is bitter cold, the kinds of produce are few, and they constantly make fishing and hunting their occupation. The pole stands forty-four to sixty-two degrees above the horizon.
notes_zh:
  - 小人：日本旧时地理书中所传的“小人国”（小人岛）之说；拉布拉多的因纽特人身材并不特别矮小，所述当属传闻。
notes_en:
  - The "small people" are the people of the legendary Land of Dwarfs (*kobito*) of older Japanese geographies; the Inuit of Labrador are not especially small, and the description is hearsay.
