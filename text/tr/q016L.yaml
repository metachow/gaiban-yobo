head_zh: 爪哇
head_en: Jawa (Java)
zh: |
  爪哇。此国是亚洲的大岛。都府〔称拔答非亚（巴达维亚）[^1]，又称咬𠺕吧（噶喇吧）〕，现今称此府为板淡[^2]。属于暎咭唎（英国），又属于和兰陀（荷兰）。据说兰人每年运到我皇国长崎通商的各种货品，都是先从本国运到此府存放的。此地之人卑贱，常裸体，然而性情对人怜爱，情意深厚。是极热之地，气候与他邦大相反。此一带全是热国，据说立八季，一年之内春二、夏二、秋二、冬二。南极出地八度或六度，北极则没入地下而不见。
en: |
  Jawa (Java). This country is a large island of Asia. Its capital 〔is called Batabiya (Batavia)[^1] and also Karauha (Kalapa)〕; at present this city is called Hantan (Banten).[^2] It belonged to Igirisu (England), and then again to Oranda (Holland). It is said that the goods which the Dutch trade every year to Nagasaki in our Imperial Land are first brought from their home country and stored in this city. The people of this land are base and always go naked; yet in their nature they are loving and deep of feeling towards others. It is a land of great heat, and the climate is the very opposite of other countries. This whole region is a hot country, and it is said that eight seasons are set up, two springs, two summers, two autumns and two winters in one year. The south pole stands eight or six degrees above the horizon, and the north pole sinks below the earth and is not seen.
notes_zh:
  - 原文“拔答非亚”旁的读音写作“ターアビヤ”（见校记），意为“バタビヤ”，即巴达维亚（今雅加达）。咬𠺕吧（噶喇吧）为其旧名。
  - 板淡（万丹，Banten）是爪哇西端的旧苏丹国，并非荷属东印度的首府；原文有误。
notes_en:
  - "The ruby beside 拔答非亞 is written ターアビヤ (see the textual notes), meant for Batabiya, Batavia, now Jakarta; Kalapa (咬𠺕吧) is its old name."
  - Banten (板淡) is an old sultanate at the western end of Java, not the capital of the Dutch East Indies; the original is in error.
