head_zh: 百儿西亚（波斯）
head_en: Perushia (Persia)
zh: |
  百儿西亚（波斯）〔又称百儿齐亚〕此国北邻鲁西亚（俄罗斯）及加乌葛须思（高加索）所领，东接印度，南以印度洋为限，西以度儿挌（土耳其）[^1]为界。此国分为二部十五道，都府称イスハン（伊斯法罕）。其人各不相同，虽然从事各种技艺，但达到精熟的人很少；而学习他国学问的人也很多。气候夏长冬短，天气燥热，没有雨露。五谷丰饶，出产大小麦。北极出地二十五度至四十三度。
en: |
  Perushia (Persia) 〔also called Harushia〕. To the north this country adjoins the territory of Roshia (Russia) and of Kaukashusu (the Caucasus); to the east it touches India; to the south it is limited by the Indian Ocean; and to the west it has Toruko (Turkey)[^1] as its boundary. The country is divided into two parts and fifteen circuits, and its capital is called Isuhan (Isfahan). The people are of various kinds; they practise many arts, but few reach mastery. Yet there are also many who study the letters of other countries. The climate has a long summer and a short winter; the weather is dry and hot, and there is no rain or dew. The five grains are abundant, and wheat and barley are produced. The pole stands twenty-five to forty-three degrees above the horizon.
notes_zh:
  - 原文作“度兒挌”，第三字为“扌”旁（见校记），当为“度兒格”，即“トルコ”。
notes_en:
  - The original writes 度兒挌 with the hand radical for the third character (see the textual notes); 度兒格 is meant, Toruko.
