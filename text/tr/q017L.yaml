head_zh: 苏门答剌（苏门答腊）
head_en: Shumodara (Sumatra)
zh: |
  苏门答剌（苏门答腊）是爪哇西北的海岛。此国分为十七部，北隅有名为アセーム（亚齐）[^1]的坚固城塞。首长不止一人。其人风俗卑贱。今多半属于和兰陀（荷兰），一部分属于暎咭唎（英国）。气候极热，春分、秋分之时，太阳在人头顶上运行，所以看不见人影。自五月至九月有飓风，又多地震、大雾。当地人中有终生不曾见过冰雪的。南北两极星都能看见，是位于赤道正下方的国家。
en: |
  Shumodara (Sumatra) is an island in the sea to the northwest of Jawa (Java). This country is divided into seventeen parts, and in the northern corner there is a strong fortress called Asēmu (Aceh).[^1] There is more than one chief; the customs of the people are base. At present most of it belongs to Oranda (Holland), and one part belongs to Igirisu (England). The climate is that of the hottest of lands: at the time of the spring and autumn equinoxes the sun circles over the very crown of the head, and so people do not see any shadow cast. From the fifth month to the ninth there are typhoons, and there are also many earthquakes and heavy fogs. Some of the people of the country have never in their lives seen ice or snow. Both the north and the south pole stars can be seen: it is a country directly under the equator.
notes_zh:
  - アセーム：即亚齐（Atjeh），位于苏门答腊北端。
notes_en:
  - "Asēmu: Aceh (Atjeh), at the northern tip of Sumatra."
