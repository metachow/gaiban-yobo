head_zh: 巴太温（巴塔哥尼亚）
head_en: Patagon (Patagonia)
zh: |
  巴太温（巴塔哥尼亚）〔一名墨尾兰（麦哲伦地）〕此国南自墨尾兰峡（麦哲伦海峡）起，北至剌伯辣多（拉普拉塔）的国界。此地是伊斯把泥亚（西班牙）的领地。其人卑贱，都以兽皮为衣服，常拉强弓，以山中狩猎为业。又，当地人没有聚居而建造房屋的，五谷极为匮乏，气候严寒。这一带附近的山上四季都有积雪。有一种说法：亚洲人称此国之人为“长人”[^1]。南极出地三十六度至五十五度。
en: |
  Patagon (Patagonia) 〔also called Megaran (Magellanica)〕. This country extends from the Mekarankau (the Strait of Magellan) in the south to the boundary of the country of Rapurada (La Plata) in the north. This land is a possession of Isubania (Spain). The people are lowly; each wears the skins of beasts as clothing, they constantly draw strong bows, and hunting in the mountains is their occupation. Again, the natives do not gather to dwell and build houses, the five grains are extremely scarce, and the climate is bitter cold. On the mountains near this place there is snow piled up in all four seasons. There is a theory that the people of Asia call the people of this country the "Tall People".[^1] The south pole stands thirty-six to fifty-five degrees above the horizon.
notes_zh:
  - 长人：即旅行记中所传巴塔哥尼亚的“巨人”传说。1520年麦哲伦一行见当地人身材高大，遂有此说，实际上他们只是较为高大而已。
notes_en:
  - "The \"Tall People\" are the Patagonian giants of the travel literature: since Magellan's voyage in 1520 the local people were reported to be of huge stature; they were in fact only rather tall."
