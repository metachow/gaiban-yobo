head_zh: 以西把尼亚（西班牙）
head_en: Isupania (Spain)
zh: |
  以西把尼亚（西班牙）。此国东北与拂兰察（法国）及ビユスカイセ海（比斯开湾）为界，南以地中海为限，西与亚太腊海（大西洋）及波尔杜尾尔（葡萄牙）为界。全国有十道，分为三十部，其都城称多勒多（马德里）[^1]。古时人才与兵威都很强盛，在欧洲无可比拟。近世和兰（荷兰）、法国、暎咭唎（英国）等的兵势增盛，占据了它过半的土地。自此国威大衰，兵势不再振作。气候北部寒冷，南部极为暖和，中部干燥炎热，冬月很少见冰。国内有一年两次收获谷物之处，其丰饶也就可想而知了。北极出地三十五度至四十四度。
en: |
  Isupania (Spain). The northeast of this country borders on Furansu (France) and the Biyusukaise Sea (the Bay of Biscay); the south is bounded by the Mediterranean, and the west borders on the Atlantic and on Horutogaru (Portugal). The whole country has ten circuits, divided into thirty parts, and its capital is called Matorita (Madrid).[^1] In ancient times its people and its military power were both flourishing, and in Europe there was none to compare with it. In recent times the military strength of Oranda (Holland), France, Igirisu (England) and others has grown, and they have seized more than half of its land. Since then the power of the state has greatly declined, and its military strength has not been restored. As to climate, the north is cold, the south extremely warm, and the middle hot and dry; ice is seldom seen in winter. There are places in the country that gather two harvests of grain in a year; its abundance can be imagined. The pole stands thirty-five to forty-four degrees above the horizon.
notes_zh:
  - 原文写作“多勒多”（托莱多），旁注的读音却是マトリタ（马德里）。今按读音译为马德里。
notes_en:
  - "The original writes the characters 多勒多 (Toledo) but reads them *Matorita*, that is Madrid; translated as Madrid, following the reading."
