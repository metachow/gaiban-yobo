head_zh: 都儿格（土耳其）
head_en: Toruko (Turkey)
zh: |
  都儿格（土耳其）〔古称厄勒祭亚（希腊），又称オツトマンニセレイキ（奥斯曼帝国）[^1]〕此国北邻鲁西亚（俄罗斯）及セーヘンベルケン（特兰西瓦尼亚）[^2]、翁加里亚（匈牙利），东以俄罗斯、黑海、マルメル湖（马尔马拉海）、ダルダネルレン（达达尼尔海峡）为界，南以地中海为限。现今分为八州，大都城名为公斯珰低诺波尔（君士坦丁堡）。其人勇壮，不畏死，常讲习兵书，专攻智谋，所以兵威极盛。此国独立自主，从不参与诸国的会盟。在欧洲诸国中属于上等之国，气候中和，土地肥沃，百物无不具备。举国都以米为常食。北部及山地寒冷，南部温暖，冬月不见冰雪。北极出地三十五度至五十度。
en: |
  Toruko (Turkey) 〔in ancient times Girishia (Greece); also Ottomanniseireiki (the Ottoman Empire)[^1]〕. To the north this country adjoins Roshia (Russia), Sēhenberuken (Transylvania)[^2] and Ongaria (Hungary); to the east it borders on Russia, the Black Sea, the Marumeru Lake (the Sea of Marmara) and the Darudanereren (the Dardanelles); to the south it is bounded by the Mediterranean. At present it is divided into eight provinces, and its great capital is called Konsutantonoppōru (Constantinople). The people are brave and do not fear death; they constantly study books of war and give themselves to strategy, and so their military power is very great. The country is independent and has never joined the alliances of the other states. It is one of the foremost countries of Europe: the climate is temperate, the land is fertile, and there is nothing it lacks. Throughout the country rice is the daily food. The north and the mountains are cold; the south is warm, and in winter there is no ice or snow. The pole stands thirty-five to fifty degrees above the horizon.
notes_zh:
  - オツトマンニセレイキ：荷兰语 Ottomanische Rijk（奥斯曼帝国）的音写。
  - セーヘンベルケン：荷兰语 Zevenbergen（“七堡”），即特兰西瓦尼亚。
notes_en:
  - "Ottomanniseireiki: the Dutch *Ottomanische Rijk*, the Ottoman Empire."
  - "Sēhenberuken: the Dutch *Zevenbergen* (\"seven castles\"), Transylvania."
