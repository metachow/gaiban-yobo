head_zh: 齐狼（锡兰）
head_en: Seiron (Ceylon)
zh: |
  齐狼（锡兰）〔一名桂岛[^1]〕在印度南海之中，北与麻辣拔儿（马拉巴尔）隔海相对。此国古时属于波尔杜尾尔（葡萄牙），中古属于和兰（荷兰），如今又被暎咭唎（英国）吞并，服从其命令。国中有高山，名アダムス[^2]，佛经所说的灵鹫山就是此山。山顶有佛的足迹，当地人说这是释迦的遗迹。古时山上有黄金大佛像，后来葡萄牙人毁坏了佛像，据说得到黄金七十万两。土地物产丰富，国家富足，人们如今崇尚华美。此地气候虽在热带之中，却不甚炎热，常有海风送来凉意。北极出地五度至八度。一说这里就是梵土的摩迦陀国[^3]。
en: |
  Seiron (Ceylon) 〔also called Keitō, the Cinnamon Island[^1]〕 lies in the southern sea of India and faces Marabaru (Malabar) to the north across the water. In ancient times this country belonged to Horutogaru (Portugal), in the middle ages to Oranda (Holland), and in the present age it has been annexed by Igirisu (England) and obeys its commands. In the country there is a high mountain called Adamusu (Adam's Peak),[^2] which according to the Buddhist teaching is the Vulture Peak itself. On its summit there is a footprint of the Buddha, which the natives say is an old trace of Shaka (Śākyamuni). In ancient times there was a great golden image of the Buddha on the mountain; in later years the Portuguese destroyed the image, and are said to have obtained seven hundred thousand *ryō* of gold. The land is rich in products and wealthy, and the people now live in splendour. The climate of this land lies within the torrid zone, but the heat is not great, and sea winds are always blowing and bring cool breezes. The pole stands five to eight degrees above the horizon. One theory says that this is the Makada (Magadha) country of the Sanskrit.[^3]
notes_zh:
  - 桂岛：即“肉桂之岛”，锡兰盛产肉桂。
  - アダムス：亚当峰（Adam's Peak），山顶的足迹佛教徒说是佛陀的，穆斯林说是亚当的。灵鹫山实为古印度摩揭陀国王舍城附近的耆阇崛山，并不在锡兰。
  - 摩迦陀即摩揭陀（Magadha），在恒河中游，不是锡兰。
notes_en:
  - Keitō, "Cinnamon Island", because Ceylon produces cinnamon.
  - Adamusu is Adam's Peak; the footprint on the summit is held by Buddhists to be the Buddha's and by Muslims to be Adam's. The Vulture Peak is in fact the Gṛdhrakūṭa hill near Rājagṛha in Magadha, not in Ceylon.
  - Magadha lay on the middle Ganges and is not Ceylon.
