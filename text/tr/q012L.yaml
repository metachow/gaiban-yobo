head_zh: 东京（越南北部）
head_en: Tonkin (northern Vietnam)
zh: |
  东京（トンキン，越南北部）〔东京与交趾，原为一国〕又称安南，是这一带的总名。此国是汉土（中国）西南的边国。近世国主的子孙相争，战事无休无止，终于分为两国。东边的称东京，南边的称唐东[^1]，又称交趾（交趾支那）。此地富饶，在印度一带也少有能与之相比的。两国风俗相同，所以不另绘交趾之图。自古服属于唐土。其人与明朝的风俗相似而又有别。北极出地十八度，是最暖之地。
en: |
  Tonkin (northern Vietnam) 〔Tonkin and Kōchi were formerly one country〕 is also called Annan, which is the general name of this region. This country is a border land to the southwest of China (Kara). In recent times, when the descendants of the ruling house were at strife and the fighting did not cease, it was finally divided into two countries. The eastern one is called Tonkin, and the southern one is called Tōtō[^1] and also Kōchi (Cochinchina). It is rich and fertile, and in the regions of India there are few that compare with it. The customs of the two countries are the same, and so Kōchi is not pictured separately. From ancient times it has been subject to China (Kara). The people resemble those of the Ming in their customs, and yet differ from them. The pole stands eighteen degrees above the horizon, and it is a very warm land.
notes_zh:
  - "唐东（原文作“唐東”）：未能确认。所指应是交趾，即廣南（Quảng Nam，南阮氏之国）；“唐”或为“廣”之误，“東”或为“南”之误，也可能是把习见的“廣東”误写。箕作省吾《新製輿地全圖》（1844）在越南以北紧邻处标“廣東”，越南南部只标“コウチ”（交趾），未见“廣南”。"
notes_en:
  - "Tōtō (唐東): not identified. The southern realm is meant, Kōchi, that is Quảng Nam (the southern Nguyễn state); perhaps 唐 is a slip for 廣 and 東 for 南, or the familiar 廣東 (Guangdong) was written by mistake. On Mitsukuri Shōgo's world map of 1844 (*Shinsei yochi zenzu*) 廣東 stands right next to northern Vietnam, while the south is marked only Kōchi; 廣南 does not appear."
