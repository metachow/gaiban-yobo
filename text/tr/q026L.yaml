head_zh: 和兰陀（荷兰）
head_en: Oranda (Holland)
zh: |
  涅垤儿兰甸（尼德兰）〔ホルランド（荷兰），又称和兰〕此国西北以北海为限，东邻独逸都（德意志），南接佛兰西（法国）。全国分为十七州[^1]，都府称アムステルタム（阿姆斯特丹）。其人温和，学术精熟，冠于各国；又专事交易，获利甚多，国内富饶。自我皇国宽永十八年[^2]起，每年驶入长崎港。气候四季寒冷，但内地温和，能出产各种物产。北部多平地，东南多山。北极出地四十九度至[^3]五十五度。
en: |
  Nēderuranden (the Netherlands) 〔Horurando (Holland), also Oranda〕. This country is limited on the northwest by the North Sea, adjoins Doitsu (Germany) to the east, and touches Furansu (France) to the south. The whole country is divided into seventeen provinces,[^1] and its capital is called Amusuterutamu (Amsterdam). The people are mild, and in their mastery of learning stand at the head of all countries; they also devote themselves wholly to trade, from which they gain much profit, and the country is rich. From the eighteenth year of Kan'ei[^2] they have come into the port of Nagasaki every year in our Imperial Land. The climate is cold in all four seasons, but the interior is gentle and produces all kinds of things well. The north has much level land and the southeast has many mountains. The pole stands forty-nine to[^3] fifty-five degrees above the horizon.
notes_zh:
  - 十七州指旧时的尼德兰十七省；当时（1855年）的荷兰王国实有十一省。
  - 宽永十八年即1641年，荷兰商馆自平户迁往长崎出岛。
  - 原文作“四十九度ミリ五十五度”，“ミリ”当为“ヨリ”（自……起）之误（见校记）；意为四十九度至五十五度。
notes_en:
  - The seventeen provinces are those of the old Netherlands; the Kingdom of the Netherlands of 1855 in fact had eleven.
  - The eighteenth year of Kan'ei is 1641, when the Dutch factory was moved from Hirado to Dejima at Nagasaki.
  - The original writes 四十九度ミリ五十五度; ミリ is evidently a slip for ヨリ (from), so that forty-nine to fifty-five degrees is meant (see the textual notes).
