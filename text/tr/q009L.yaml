head_zh: 鞑靼
head_en: Dattan (Tartary)
zh: |
  鞑而靼〔今人省去“而”字〕此名大概是北亚洲的总称。近世分为三大部〔支那鞑靼、独立鞑靼、鲁西亚（俄罗斯）鞑靼〕，各部之内又分为数国，各有其主。其人勇壮，喜好弓马，善使长枪。尊称其国主为大汗。其中服属于汉土（中国）[^1]的，称为支那鞑靼。此国北以亚洲俄罗斯的一部分为界，东邻支那，南接印度及百儿西亚（波斯），西至北高海（里海）及俄罗斯领地。是最大的国家，古时的胡国以及蒙古等，都是这一地区的别称。北极出地四十三度至六十四度，气候极寒。四季昼夜的长短与他国大不相同。
en: |
  Dattan (Tartary), written 韃而靼 〔people today omit the character 而〕. This name is, it seems, the general name of northern Asia. In recent times it has been divided into three great parts 〔Chinese Tartary, Independent Tartary and Russian Tartary〕, and each part is again divided into several countries, each with its own ruler. The people are brave and sturdy, fond of the bow and the horse, and good at wielding the long spear. They address the ruler of their country by the honorific Great Khan. Those among them who are subject to China (Kara)[^1] are called Chinese Tartary. To the north this country borders on a part of Asian Russia (Roshia), to the east it adjoins Shina (China), to the south it touches India and Perushia (Persia), and to the west it reaches the Caspian Sea and the Russian possessions. It is the largest of countries; the Hu country of antiquity, and also Mongolia and the like, are all other names for this region. The pole stands forty-three to sixty-four degrees above the horizon, and the climate is that of a land of great cold. The length of the days and nights through the four seasons differs greatly from other countries.
notes_zh:
  - 原文作“漢上”，当为“漢土”之误（见校记），此处按“汉土”译出。
notes_en:
  - The original has 漢上, evidently a slip for 漢土 (Kara, China); translated as China.
