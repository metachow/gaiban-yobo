head_zh: 波尔杜尾尔（葡萄牙）
head_en: Horutogaru (Portugal)
zh: |
  波尔杜尾尔（葡萄牙）。此国东北与以西把尼亚（西班牙）接境，西南以亚太腊海（大西洋）为限。都城称里西波（里斯本）。据说古时隶属于西班牙，数年之后成为自立的王国。自此国中分为六部，大为繁盛。其人怠惰，无意致力于学术，只是极其喜好交易。但据说近世也有致力于学术的人。气候有寒有暖，全国虽多山岳，却能出产各种物产，所做的交易为邻国所不能比，因而富足。北极出地三十六度至四十二度。
en: |
  Horutogaru (Portugal). The northeast of this country borders on Isubania (Spain), and the southwest is bounded by the Atlantic. The capital is called Risupo (Lisbon). In ancient times it is said to have belonged to Spain; some years later it became an independent kingdom. Since then the country has been divided into six parts and has greatly prospered. The people are idle and have no mind to apply themselves to learning; they care only for trade, and that to an extreme. But in recent times, it is said, there are some who apply themselves to learning. The climate has both cold and warmth, and there are many mountains throughout the country, yet it produces all kinds of goods and carries on a trade unrivalled among its neighbours, so that it is rich and plentiful. The pole stands thirty-six to forty-two degrees above the horizon.
