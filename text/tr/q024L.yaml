head_zh: 际若私（锡克）
head_en: Seikusu (the Sikhs)
zh: |
  际若私（锡克）〔旧为莫卧儿，又称シケイクス[^1]〕我皇国宽政年间[^2]莫卧儿帝灭亡之后，此国新立国号，是前印度[^3]中部的国家。其边界与满剌甸（马拉塔）及暎咭唎（英国）的领地相邻，兼有ラホル（拉合尔）、アガラ（阿格拉）〔昔日莫卧帝都城的遗址〕及テルヒ（德里）的一部分，成为一大州。其内分为数国，各有酋长，推举其中一人为当年的盟主，在政府中会商，议定诸事。其都府称拉合尔。古时极为繁盛，冠于东方诸州；如今沦为战场，人民离散，据说多成废墟。其人傲虐[^4]，但善于在马上使长枪。土地肥沃，五谷一年成熟两三次。原是印度的一部分，不服从西洋各国的命令。北极出地二十二度至三十一度。
en: |
  Seikusu (the Sikhs) 〔formerly Mongoru (the Mughal), also Shikeikusu[^1]〕. This country took a new name after the Mughal emperor was destroyed, in the Kansei era of our Imperial Land.[^2] It is a country in the middle part of Hither India.[^3] Its boundaries adjoin Maratten (the Marathas) and the territories of Igirisu (England), and it holds Rahoru (Lahore), Agara (Agra) 〔the site of the former capital of the Mughal emperors〕 and a part of Teruhi (Delhi), and makes one great province. Within it, it is divided into several countries, each with its chief. One of them is chosen to be the head of the league for the year, and they deliberate in the government and decide all matters. Its capital is called Lahore. In ancient times it was extremely prosperous and stood at the head of the eastern provinces. In the present age it has become a scene of wars; the people have scattered, and it is said that there are very many ruined sites. The people are arrogant and cruel,[^4] but they are skilled at wielding the long spear on horseback. The soil is fertile, and the five grains ripen two or three times a year. It was originally a part of India and does not obey the commands of the Western countries. The pole stands twenty-two to thirty-one degrees above the horizon.
notes_zh:
  - 原文割注作“旧莫卧儿，又シケイクス”（见校记），シケイクス是同一名称（锡克，Sikh）的另一种拼法。
  - 宽政（1789—1801）。锡克王国建于1799年，创建者为兰吉特·辛格；莫卧儿皇帝在名义上仍存至1857年。锡克王国于1849年为英国吞并。
  - 前印度：指恒河以内的印度（Hither India）。
  - 原文旁注的读音作“ダジヤク”（惰弱），字形却明确是“傲虐”（见校记）；按字形译出。
notes_en:
  - The small note in the original reads "formerly Mughal, also Shikeikusu" (see the textual notes), the same Sikh name as in the heading in another spelling.
  - Kansei is 1789–1801. The Sikh state arose in 1799 under Ranjit Singh; the Mughal emperor in fact survived in name until 1857. The Sikh state was annexed by Britain in 1849.
  - Hither India is India within the Ganges.
  - The ruby in the original reads *dajaku* (idle and weak), but the characters are plainly 傲虐 (arrogant and cruel); translated from the characters.
