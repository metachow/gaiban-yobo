head_zh: 合众国（美国）
head_en: Gōshūkoku (the United States)
zh: |
  合众国。此国北接新貌利太泥亚（英属北美）[^1]，南至墨是可（墨西哥），东西两面临大洋。全国原来分为八国，接着成为十三州，近世增加到三十一州。此地并无国王或酋长，而是共和之州，各国推举其中的贤者担任政官。所以各国的长者会盟，共同治理。其都城称ワツシングトン（华盛顿）。其人原是欧洲诸国的人种，各国风俗不一，但性情勇壮，又喜好学术，法度极严。气候寒冷，但内地温和，出产多种物产。与欧洲诸国、东西印度及支那通商，极为富裕丰饶。北极出地三十五度至五十三度。
en: |
  The United States. The north of this country joins Shinpuritania (British North America),[^1] and the south reaches Mekishiko (Mexico); east and west it faces the great oceans. The whole country was originally divided into eight countries, then became thirteen states, and in recent times has increased to thirty-one states. In this land there is no king or chieftain; the states are republics, and in each country they choose the worthiest to be officials of government. Therefore the elders of each country meet in alliance and govern in common. The capital is called Wasshinguton (Washington). The people were originally the races of the states of Europe, and the customs of each country are not uniform, but their nature is brave, they love learning, and their laws are extremely strict. The climate is cold, but the interior is good and mild, and produces many kinds of things. It trades with the states of Europe, the East and West Indies and Shina (China), and is very rich and plentiful. The pole stands thirty-five to fifty-three degrees above the horizon.
notes_zh:
  - 新貌利太泥亚（新不列颠尼亚）指英属北美（今加拿大）。下一页所载即此国。
notes_en:
  - Shinpuritania, "New Britannia", is British North America (now Canada); the next page bears the same name.
