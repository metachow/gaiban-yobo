head_zh: 雪际亚（瑞典）
head_en: Sueshia (Sweden)
zh: |
  雪际亚（瑞典）〔同盟国诺而勿惹亚（挪威）〕此国北以冰海为限，东与鲁西亚（俄罗斯）及窝窝所的海（波罗的海）为界，南临ソンド（松德海峡）及カツテカツト（卡特加特海峡），西以北海为限。全国分为九大部，都城称斯督泛福儿摸（斯德哥尔摩）。其人与第那玛尔加（丹麦）人相似，临战极为勇壮。气候寒冷，多山岳，其北部四季有雪，当地人勤于农耕，出产谷类。又，挪威分为五大部，各设一镇，其首府称キリスナアナ（克里斯蒂安尼亚）[^1]。此地之人粗野鄙陋，气候最为寒冷，多山岳和旷野，出产优良的木材，商业尤为兴盛。瑞典、挪威二国共同商议，治理政事。北极出地，跨两国计，五十五度至七十二度。
en: |
  Sueshia (Sweden) 〔allied country: Norueshia (Norway)〕. To the north this country is bounded by the Arctic Ocean; to the east it borders on Roshia (Russia) and the Oosuto Sea (the Baltic); to the south it faces Sondo (the Sound) and the Kattegatto (the Kattegat), and to the west it is bounded by the North Sea. The whole country is divided into nine great parts, and the capital is called Sutokufuorumu (Stockholm). The people resemble the people of Dēnemaruka (Denmark), and are extremely brave when they face military affairs. The climate is cold and there are many mountains; its northern part has snow in all four seasons. The natives work diligently at farming and produce grain. Again, Norway is divided into five great parts, each with its governor, and its chief city is called Kirisunaana (Christiania).[^1] The people of this land are rustic, the climate is extremely cold, and there are many mountains and wilds; it yields good timber, and its trade is especially flourishing. Sweden and Norway govern their affairs by consulting together. The pole stands, taking the two countries together, fifty-five to seventy-two degrees above the horizon.
notes_zh:
  - 克里斯蒂安尼亚是今奥斯陆的旧称（1624—1925）。
notes_en:
  - Christiania is the old name of Oslo (1624–1925).
