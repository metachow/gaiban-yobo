head_zh: 跋
head_en: Afterword
zh: |
  乾册自亚洲至欧洲。欧洲部分横跨乾、坤两册，这是衡量了纸数的多寡[^1]，所以乾册止于暎咭唎（英国），自波尔杜尾尔（葡萄牙）以下载于坤册。
en: |
  The Ken (Heaven) volume runs from Asia to Europe. The section on the continent of Europe, moreover, extends over both volumes, Ken and Kon (Earth); weighing the number of leaves, too many or too few,[^1] the Ken volume stops at Igirisu (England), and from Horutogaru (Portugal) onwards the countries are shown in the Kon volume.
notes_zh:
  - 原文“紙數ノ過少”，当指两册纸数的多寡，即为使两册厚薄相当而如此分册。
notes_en:
  - "紙數ノ過少, literally \"excess and shortfall of the number of leaves\": the division was made so that the two volumes would be of about equal size."
