head_zh: 波罗尼亚（波兰）
head_en: Horonia (Poland)
zh: |
  波罗尼亚（波兰）。此国西北接独逸都（德意志）联合州[^1]，东与鲁西亚（俄罗斯）为界，南邻翁加里亚（匈牙利），全国分为八道，都城称ミーコウ（梅胡夫）〔カラカウ（克拉科夫）道的首府〕[^2]。其人颇为勇刚，兵威强盛。本是自立的王国，后来因国内争战，干戈无止息之时，自此国势衰落。近世隶属于俄罗斯。境内有一处由俄罗斯、德意志、孛漏生（普鲁士）等共同实行共和政治的地方，称为克拉科夫[^3]。气候寒暖适中，多连日晴天，冬月有时严寒。土地全是平地，出产多种物产。北极出地四十八度至五十五度。
en: |
  Horonia (Poland). The northwest of this country joins the German Confederation;[^1] the east borders on Roshia (Russia), and the south neighbours Ongaria (Hungary). The whole country is divided into eight circuits, and the capital is called Mīkō (Miechów) 〔the chief city of the Karakau (Kraków) circuit〕.[^2] The people are very brave and strong, and their military power is great. It was originally an independent kingdom, but afterwards, from wars among its own people, shields and spears never rested, and from then the strength of the state declined. In recent times it has belonged to Russia. Within its borders there is a place under the joint republican government of Russia, Doitsu (Germany), Furoisen (Prussia) and others, which is called Kraków.[^3] The climate is temperate between cold and warm, and fine weather often continues for days; in winter there is sometimes bitter cold. The land is all plain, and many kinds of produce are grown. The pole stands forty-eight to fifty-five degrees above the horizon.
notes_zh:
  - 原文作“獨逸都連合州”（读ドイツレンガウ），指1815年成立的德意志邦联。
  - ミーコウ：《坤舆图识》称波兰首都为ワルスコウ（华沙），此处所指或为梅胡夫（克拉科夫省的省会），与割注“カラカウ道的首府”相合；未能确证。
  - 原文作ガラカウ，即克拉科夫自由市（1815—1846），名义上由俄、奥、普三国共同保护。
notes_en:
  - "The original reads *Doitsu rengau-shū* (\"German union province\"); the German Confederation of 1815 is meant."
  - "Mīkō: the *Kon'yo zushiki* names Warsaw as the capital of Poland; probably Miechów, seat of the Kraków voivodeship, is meant, as the small note says, but this is not certain."
  - "The original writes Garakau; this is the Free City of Kraków (1815–1846), placed under the protection of Russia, Austria and Prussia."
