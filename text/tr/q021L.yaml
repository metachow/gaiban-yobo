head_zh: 食力百私（西里伯斯）
head_en: Serebesu (Celebes)
zh: |
  食力百私（西里伯斯）〔一名望加锡〕是位于吕宋之南、浡耳匿何（婆罗洲）之东的海岛。此国分为两部，东岸称食力百私，西岸称望加锡。有两位酋长，各自分领。国中有高山，名ボントハイン[^1]，极高。以此山为界分为东西，各有不同的国名，风俗气候也不相同。近世为暎咭唎（英国）所并，又有一部分归属和兰（荷兰）。附属的岛屿有〔ハルカ[^2]、地木儿（帝汶）〕。气候极热，五谷匮乏。其人卑贱，常食沙古米（西谷米），以马肉做羹。南北两极星都能看见，与苏门答剌（苏门答腊）相同。
en: |
  Serebesu (Celebes) 〔also called Makasaru (Makassar)〕 is an island in the sea south of Rusu (Luzon) and east of Horuneo (Borneo). The country is divided into two parts: the eastern coast is called Serebesu, and the western coast is called Makassar. There are two chiefs, each of whom rules his own part. In the country there is a high mountain called Bontohain,[^1] extremely high. The mountain divides east and west, and each side has a different name for its country; their customs and climate also differ. In recent times it has been annexed by Igirisu (England), and one part depends on Oranda (Holland). Its dependencies include islands 〔Haruka[^2] and Chimoru (Timor)〕. The climate is that of a land of great heat; the five grains are scarce; the people are base and always eat sago and make soup of horse flesh. Both the north and the south pole stars can be seen, as in Shumodara (Sumatra).
notes_zh:
  - ボントハイン：Bonthain（班泰恩），即苏拉威西南部的洛波巴唐峰（Lompobattang）一带之山。
  - "ハルカ：未能确认。《坤舆图识》在食力百私条下即有此名（“其附属岛有二，一曰ハルカ，民口七千，一曰地木儿”）。高桥景保《新订万国全图》（1810）在西里伯斯北臂附近有带城镇记号的“ハルセ”，或与此有关，未能确证。"
notes_en:
  - "Bontohain: Bonthain (Bantaeng), the mountain of southern Sulawesi now known as Lompobattang."
  - "Haruka: not identified. The name is found in the *Kon'yo zushiki* under Celebes (two dependent islands, one called Haruka with seven thousand inhabitants, the other Timor). Takahashi Kageyasu's *Shintei bankoku zenzu* (1810) marks a town \"Haruse\" near the northern arm of Celebes, which may be related; not certain."
