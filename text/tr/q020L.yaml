head_zh: 亚尔默尼亚（亚美尼亚）
head_en: Arumenia (Armenia)
zh: |
  亚尔默尼亚（亚美尼亚）。此国北以黑海为界，东邻百儿西亚（波斯），南接亚洲的都儿格（土耳其），西临欧洲的都儿格。四季分明，是上等之国。五谷成熟良好，人民也勇壮。此邦古时属于印度[^1]，今世并入都儿格。北极出地四十度强。
en: |
  Arumenia (Armenia). To the north this country borders on the Black Sea, to the east it adjoins Perushia (Persia), to the south it touches Asian Toruko (Turkey), and to the west it faces European Turkey. It has four seasons and is a country of the first rank. The five grains ripen well, and the people are brave and sturdy as well. In ancient times this land belonged to India,[^1] and in the present age it has been annexed to Turkey. The pole stands a little over forty degrees above the horizon.
notes_zh:
  - 亚美尼亚古时并不属于印度，此说有误。
notes_en:
  - Armenia did not in antiquity belong to India; the statement is mistaken.
