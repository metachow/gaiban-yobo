head_zh: 吕宋
head_en: Roson (Luzon)
zh: |
  吕宋〔一名非利皮那（菲律宾），是数个小岛的〕总名。又有数十个首长，其大府称为玛泥儿诉城（马尼拉）。此国是台湾之南的海岛。古时南蛮[^1]人占据了它。中古为暎咭唎（英国）所并[^2]，又属于伊斯把泥亚（西班牙）。是极热之国，湿毒深重，病人很多。其人极为卑贱。五谷产量极多。北极出地十五度至十八度。
en: |
  Roson (Luzon) 〔also called Hirihina (the Philippines), is the〕 general name of several small islands. It also has several tens of chiefs, and its great city is called Manirura (Manila). This country is an island in the sea south of Daiwan (Taiwan). In ancient times the Nanban[^1] seized it. In the middle ages it was annexed by Igirisu (England),[^2] and again it belongs to Isubania (Spain). It is a land of great heat, with deep-seated damp poisons, and many are sick. The people are extremely base; the five grains are produced there most abundantly. The pole stands fifteen to eighteen degrees above the horizon.
notes_zh:
  - 南蛮：此指葡萄牙人、西班牙人等南来的欧洲人。
  - 英国人于1762至1764年占领马尼拉，后归还西班牙。
notes_en:
  - The Nanban are the Europeans who came from the south, here Portuguese and Spaniards.
  - The British occupied Manila from 1762 to 1764 and then returned it to Spain.
