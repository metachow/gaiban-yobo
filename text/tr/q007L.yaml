head_zh: 大明
head_en: Taimin (Great Ming)
zh: |
  卷首先载帝国明朝的人物，只是为了让人见识汉土（中国）往昔的风俗。唐土历代开国之君都自行改立国号，所以并没有固定的国号。古时韩人归附我皇国，往来不绝，因此把异邦称作“伽罗”[^1]，所以〔“汉”“唐”“韩”这几个字〕都训读为“伽罗”。又称支那，也称震旦[^2]。西洋人称这片土地为知纳（China），据说由来已久。此国自以为居于世界的中心，夸称“中华”。大明一统之时，定十五省，立一京十三道[^3]，遵循尧舜的遗法，礼乐通行，文笔大盛。到永历年间[^4]，天下归于清。可惜，古时的风俗就此断绝。
en: |
  We place the people of the Ming empire first only in order to show the customs of China (Kara) of old. In China the founder of each dynasty has himself changed the name of the country, so it has no fixed name. In ancient times the people of Kan (Korea) submitted to our Imperial Land and came and went, and so foreign lands were called *Kara*;[^1] for this reason 〔the characters 漢, 唐 and 韓〕 are all read *kara*. The country is also called Shina, and also Shindan.[^2] Westerners call this land China (Chiina), a name said to be very old. Holding itself to be the centre of the world, the country proudly calls itself Chūka, the Central Flower. When the Great Ming unified the realm it fixed fifteen provinces and set up one capital and thirteen circuits;[^3] it followed the laws handed down from Yao and Shun, rites and music were practised, and letters flourished greatly. In the Yongli era[^4] the whole realm passed to the Qing. Alas, the customs of old came to an end here.
notes_zh:
  - 伽罗（から）：日语古称朝鲜半岛诸国为“から”，后泛指中国以至外国。汉、唐、韩诸字在日语中都可训读为“から”。
  - 原文作“震且”，当为“震旦”（见书后校记）。
  - 明代设两京（北京、南京）十三布政使司，合称十五省。原文“一京十三道”与此略有出入。
  - 永历（1647—1662）是南明桂王的年号。1662年永历帝被杀，南明亡。
notes_en:
  - "*Kara*: an old Japanese name for the states of the Korean peninsula, later for China and for foreign lands in general. The characters for Han, Tang and Han (Korea) can all be read *kara* in Japanese."
  - The original writes 震且 for 震旦 (see the textual notes at the end of the volume).
  - Under the Ming there were two capitals (Beijing and Nanjing) and thirteen provinces, fifteen in all; the author's "one capital and thirteen circuits" differs slightly.
  - Yongli (1647–1662) was the era of the last Southern Ming emperor, who was put to death in 1662.
