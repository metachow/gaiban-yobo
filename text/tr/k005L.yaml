head_zh: 意太里亚（意大利）
head_en: Itaria (Italy)
zh: |
  意太里亚（意大利）此地是半岛之国，北接赫尔勿萋亚（瑞士）及独逸都（德意志），东与德意志及アトリアチセ海（亚得里亚海）、勿搦祭亚（威尼斯）为界，南以地中海为限，西邻佛兰西（法国）。全国分为九州，都城称罗玛（罗马）〔德意志帝的西都旧迹〕[^1]。有三百二十八所寺院，其中最大的一座大殿高十六丈六尺，其宽大、华美、精巧，古今无与伦比。或许因此，这个国家才有“殿堂领”之称[^2]。其人贤智，然而猜忌心重，遇事多心怀疑惧。又精通学术，出产钟表及其他奇巧之物。国内虽多山岳，平地却气候和顺，五谷成熟良好，富裕丰饶。北极出地三十五度至四十六七度。
en: |
  Itaria (Italy). This land is a peninsular country; to the north it joins Heruheshia (Switzerland) and Doitsu (Germany), to the east it borders on Germany, the Atoriachise Sea (the Adriatic) and Henechia (Venice), to the south it is bounded by the Mediterranean, and to the west it adjoins Furansu (France). The whole country is divided into nine provinces, and the capital is called Rōma (Rome) 〔the old site of the western capital of the German emperor〕.[^1] There are three hundred and twenty-eight temples, and the greatest of them is a great hall sixteen *jō* six *shaku* high, so broad, beautiful and ingenious that nothing past or present surpasses it. It may be for this reason that this country bears the name "Domain of the Halls".[^2] The people are wise and clever, but deeply suspicious, and many of them are full of misgivings when a matter is at hand. They are also skilled in learning, and produce clocks and other rare and curious things. There are many mountains in the country, but the plains have a mild and harmonious climate; the five grains ripen well, and the land is rich and plentiful. The pole stands thirty-five to forty-six or forty-seven degrees above the horizon.
notes_zh:
  - 罗马曾是神圣罗马（德意志）皇帝加冕之地，作者或因此称之为“西都”。
  - 殿堂领：大概是荷兰语 Kerkelijke Staat（教会国家）的意译，即教皇国。作者以此名指称全意大利。十六丈六尺约合五十米。
notes_en:
  - Rome was where the Holy Roman (German) emperors were crowned; perhaps hence "western capital".
  - "*Dendōryō*, \"Domain of the Halls\": probably a rendering of the Dutch *Kerkelijke Staat*, the Ecclesiastical State, i.e. the Papal States; the author applies the name to all of Italy. Sixteen *jō* six *shaku* is about fifty metres."
