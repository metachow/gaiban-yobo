head_zh: 阨入多（埃及）
head_en: Ejifuto (Egypt)
zh: |
  阨入多（埃及）。此国北以地中海为限，东临红海，南邻恕皮亚（努比亚），西接把尔加（巴尔卡）及沙拉（撒哈拉）。全国分为三大部，其首府称该禄（开罗）。又有一座突出于地中海的都城，名为アレキサンドリア（亚历山大），诸州之人来此地进行交易。全国都是度儿格（土耳其）的领地，各设有镇。其人天资善良，聪明伶俐，当地人以农业为业。又工艺兴盛，制造各种器物。气候温和，出产上好的稻米和大小麦，十分肥饶。北极出地二十四度至三十一度。
en: |
  Ejifuto (Egypt). To the north this country is bounded by the Mediterranean; to the east it faces the Red Sea; to the south it neighbours Niebia (Nubia); to the west it adjoins Baruka (Barca) and Sāra (the Sahara). The whole country is divided into three great parts, and its chief city is called Gairo (Cairo). There is also a city that juts out into the Mediterranean, called Arekisandoria (Alexandria), where people of all states come to trade. The whole is the possession of Toruko (Turkey), and each part has its governor. The people are of good natural disposition and clever, and the natives work at farming. Crafts also flourish, and they make wares of all kinds. The climate is good and mild; the country produces fine rice and wheat and barley, and is very fertile. The pole stands twenty-four to thirty-one degrees above the horizon.
