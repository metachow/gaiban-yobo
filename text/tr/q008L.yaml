head_zh: 大清
head_en: Taishin (Great Qing)
zh: |
  帝国支那全国分为十八省，有二府〔北京、南京〕。此国北以满洲及蒙古为界，东临太平洋，与朝鲜陆地相连，南接印度洋及东印度〔即天竺[^1]〕，西邻图伯特（西藏）。其帝都称北京省顺天府，是天下无二的大府〔这是战国时燕国的都城，元、明、清都定都于此〕。气候北部寒冷，霜雪多；南部夏月炎热，冬月暴风大雨极多。北极出地二十一度至四十一度。我皇国正保年间[^2]，清太祖[^3]自鞑靼兴起，灭明，国号大清。统一之后，改用鞑靼服制，成了夷狄的装束，所以已不是中华古时的风俗。国中四等之民[^4]都有精通学问的人，这一点也冠于五大洲。
en: |
  The whole of the Empire of Shina (China) is divided into eighteen provinces, and there are two capitals 〔Beijing and Nanjing〕. To the north the country borders on Manchuria and Mongolia; to the east it faces the Pacific Ocean and is joined by land to Korea; to the south it touches the Indian Ocean and the East Indies 〔that is, Tenjiku〕;[^1] to the west it adjoins Chipetto (Tibet). Its imperial capital is called Beijing, in Shuntian Prefecture, and is the greatest prefecture under heaven, without a second. 〔This was the capital of the state of Yan in the Warring States period; the Yuan, the Ming and the Qing all made it their capital.〕 Climate: the north is cold, with much frost and snow; in the south the summer months are scorching, and in the winter months violent winds and heavy rains are extremely frequent. The pole stands twenty-one to forty-one degrees above the horizon. In the Shōhō era of our Imperial Land,[^2] Taizu of the Qing[^3] arose from Tartary, destroyed the Ming, and named the country the Great Qing. After the unification the people changed over to Tartar dress and took on the look of barbarians, so that the old customs of the Central Flower are no more. Among the people of the country, the four classes alike,[^4] those who are accomplished in learning also stand at the head of the five continents.
notes_zh:
  - 原文作“天笠”，当为“天竺”（见书后校记）。
  - 正保（1644—1648）。1644年清军入北京。
  - 清太祖指努尔哈赤（后金，1616年建国）；明亡于1644年，其时在位的是顺治帝。
  - 四等之民：士、农、工、商。
notes_en:
  - The original writes 天笠 for 天竺 (see the textual notes at the end of the volume).
  - Shōhō is 1644–1648; the Qing took Beijing in 1644.
  - Taizu of the Qing is Nurhaci (the Later Jin, founded 1616); the Ming fell in 1644, in the reign of the Shunzhi emperor.
  - The four classes are scholars, farmers, artisans and merchants.
