head_zh: 翁加里亚（匈牙利）
head_en: Ongaria (Hungary)
zh: |
  翁加里亚（匈牙利）。此国北接ロドミリー（洛多梅里亚），东邻ワラシエ（瓦拉几亚）及セーベルゲン（特兰西瓦尼亚）[^1]，南以スラホニー（斯拉沃尼亚）及セルビー（塞尔维亚）为界，西与クルマーナ[^2]接境。全国分为二部，又分为四道，首要的都城称プレスビユルク（普雷斯堡）。古时是自立的王国，兵威使近邻臣服。如今隶属于窝窝斯甸礼畿（奥地利）。其人善战，长于思虑，信从其君主，坚守节义。全国多山，气候北部冬月严寒，南部有夏月炎热之处。土地肥饶，谷物成熟良好。北极出地四十四度至四十八度。
en: |
  Ongaria (Hungary). The north of this country adjoins Rodomirī (Lodomeria), the east neighbours Warashie (Wallachia) and Sēberugen (Transylvania);[^1] the south is bounded by Surahonī (Slavonia) and Serubī (Serbia), and the west borders on Kurumāna.[^2] The whole country is divided into two parts and again into four circuits; the foremost city is called Puresubiyuruku (Pressburg). In ancient times it was an independent kingdom, and its military power subdued its neighbours. Now it belongs to Oosutenreiki (Austria). The people are good at war and gifted in thought; they trust and follow their lord, and keep faith the more firmly. The country is mountainous throughout; as to climate, the north has bitter cold in winter, and the south has places of burning heat in summer. The land is fertile and the grain ripens well. The pole stands forty-four to forty-eight degrees above the horizon.
notes_zh:
  - セーベルゲン：德语 Siebenbürgen（“七堡”），即特兰西瓦尼亚，与都儿格（土耳其）一页的セーヘンベルケン同。
  - クルマーナ：未能考定，或指克罗地亚。
notes_en:
  - "Sēberugen: the German *Siebenbürgen* (\"seven castles\"), Transylvania, the same as Sēhenberuken on the Turkey page."
  - "Kurumāna: not identified; perhaps Croatia."
