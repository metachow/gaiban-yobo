head_zh: 鲁西亚（俄罗斯）
head_en: Roshia (Russia)
zh: |
  帝国鲁西亚（俄罗斯）。此国北以冰海为限，东以亚洲及里海[^1]为界，南与黑海及亚洲接境，西接雪际亚（瑞典）、窝窝所的海（波罗的海）、孛漏生（普鲁士）、波罗尼亚（波兰）、翁加里亚（匈牙利）及度儿格（土耳其），是世界第一大国，自欧洲横跨亚洲，与我皇国奥虾夷诸岛相连接。全国分为五十一镇〔其中经增设，四十镇在欧洲，十三镇在亚洲〕[^2]，大都城号称ペイトルビユルク（圣彼得堡）。其人勇壮，精熟军术。近世有一位名叫伯德禄（彼得大帝）的英主兴起，大力扩充武备，兵威极盛，西洋诸州无可与之相比者。气候寒暖变化急速而不平和，东部尤甚。南部十分肥饶，出产诸种谷物。北极出地四十四度至七十八度。
en: |
  The Empire of Roshia (Russia). To the north this country is bounded by the Arctic Ocean; to the east it is bounded by Asia and the Caspian Sea;[^1] to the south it borders on the Black Sea and on Asia; to the west it adjoins Sueshia (Sweden), the Oosuto Sea (the Baltic), Furoisen (Prussia), Horonia (Poland), Ongaria (Hungary) and Toruko (Turkey). It is the greatest country in the world, stretching from Europe across Asia, and it joins the islands of Oku-Ezo of our Imperial Land. The whole country is divided into fifty-one governorates 〔of which forty, with the additions, are in Europe, and thirteen are in Asia〕,[^2] and the great capital is called Peitorubiyuruku (St Petersburg). The people are brave and well trained in the military art. In recent times an able ruler called Peitoru (Peter the Great) arose, greatly increased the military preparations, and the country's military power is very great; none of the Western states compares with it. The climate changes quickly between cold and warm and is not mild, especially in the east. The south is very fertile and produces all kinds of grain. The pole stands forty-four to seventy-eight degrees above the horizon.
notes_zh:
  - 原文作“北高海”，即里海。
  - 五十一镇与割注所列的四十加十三（共五十三）不合，原文如此。
notes_en:
  - The original calls it the *Hokkōkai* (北高海), the name of the Caspian on the Jesuit world maps and in Dutch-learning geography.
  - Fifty-one does not agree with the forty and thirteen of the small note, which make fifty-three; so in the original.
