head_zh: 暹罗（泰国）
head_en: Shamuro (Siam)
zh: |
  暹罗（泰国）在汉土（中国）的西南，是印度的南隅。此国分为八部，其主府[^1]称暹罗，部内有三位小王，都听从国王的命令。又东南有称为东埔塞（柬埔寨）的国家，属于暹罗。其人卑贱，中等以下的人都赤脚。四季炎热，一年耕种两三次，都能成熟，所以米谷极为便宜。北极出地十三度。
en: |
  Shamuro (Siam) lies to the southwest of China (Kara) and is the southern corner of India. This country is divided into eight parts, and its main city[^1] is called Shamuro. Within the country there are three petty kings, all of whom obey the commands of the king. To the southeast there is also a country called Kambocha (Cambodia), which belongs to Siam. The people are base, and all from the middle sort downwards go barefoot. All four seasons are hot; the fields are tilled two or three times a year and the crops ripen well every time, and so rice and grain are very cheap. The pole stands thirteen degrees above the horizon.
notes_zh:
  - “主府”的“主”字，校记认为文意应为“王府”（王都）。
notes_en:
  - The textual notes point out that 主 in 主府 should, to judge by the sense, be 王, that is, the royal capital.
