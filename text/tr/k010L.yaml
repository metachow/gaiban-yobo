head_zh: 第那玛尔加（丹麦）
head_en: Dēnemaruka (Denmark)
zh: |
  第那玛尔加（丹麦）〔兼有丹麦、ヘルロ诸岛（法罗群岛）、依兰土（冰岛）三部〕此国是欧洲最古老的王国。北以カツテガツト（卡特加特海峡）〔一名シカーゲラツク（斯卡格拉克海峡）〕为界，东邻窝窝所的海（波罗的海）及独逸都（德意志），南以エルヘ河（易北河）为界，西以北海为限。全国分为大陆与岛屿二部，都城称郭逬浛尾（哥本哈根）。古时人才与兵威都很强盛，今世大为衰落，称为其属国者，至今只有冰岛一州而已。气候极为寒烈，平地则和顺，出产五谷与良马。北极出地五十三度至五十八度。
en: |
  Dēnemaruka (Denmark) 〔it holds three parts together: Denmark, the Heruro Islands (the Faroes) and Eisurando (Iceland)〕. This country is the oldest kingdom in Europe. To the north it is bounded by the Kattegatto (the Kattegat) 〔also called Shikāgerakku (the Skagerrak)〕; to the east it adjoins the Oosuto Sea (the Baltic) and Doitsu (Germany); to the south it is bounded by the River Eruhe (the Elbe), and to the west it is limited by the North Sea. The whole country is divided into two parts, the mainland and the islands, and the capital is called Koppenpaaka (Copenhagen). In ancient times its people and its military power were both strong; in the present age it has greatly declined, and of those called its dependencies only the one province of Iceland remains to this day. The climate is extremely cold and fierce; the plains are mild, and produce the five grains and good horses. The pole stands fifty-three to fifty-eight degrees above the horizon.
