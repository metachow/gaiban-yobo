head_zh: 泥乂利西亚（尼格里提亚）
head_en: Nigirishia (Nigritia)
zh: |
  泥乂利西亚（尼格里提亚）〔一名ゼネカムビー（塞内冈比亚）〕[^1]此国北以大沙漠为限，东邻亚昆心域（阿比西尼亚），南接为匿亚（几内亚），西至热河（塞内加尔河）。全国分为三部，各有君长，其首府称东布（廷巴克图）。其人风俗卑贱，当地人多是〔ヱチヲピヤ（埃塞俄比亚）种，即黑人〕，面色黑，性情极为愚昧，不知礼义，劫掠邻近诸州之人，或把本国的妇女儿童卖给欧洲人。西洋人把他们当作自己的奴仆。气候炎热，令人难以忍受。北极出地八度至十八度。
en: |
  Nigirishia (Nigritia) 〔also called Zenekambī (Senegambia)〕.[^1] To the north this country is bounded by the great desert; to the east it neighbours Abishinī (Abyssinia); to the south it adjoins Goinea (Guinea); to the west it reaches the River Zenega (the Senegal). The whole country is divided into three parts, each with its own ruler, and its chief city is called Tombiyuku (Timbuktu). The customs of the people are lowly; the natives are mostly of 〔the Echiopiya (Ethiopian) race, that is, black people〕, their faces are black, and their nature is extremely ignorant, so that they do not know propriety and right; they carry off the people of the neighbouring states, or the women and children of their own country, and sell them to the Europeans. The Westerners make them their slaves. The climate is hot and hard to bear. The pole stands eight to eighteen degrees above the horizon.
notes_zh:
  - 泥乂利西亚即“黑人之地”（Nigritia），指非洲西部内陆；“埃塞俄比亚人”在当时的西洋地理书中泛指黑种人。
notes_en:
  - Nigritia is the "land of the Blacks", the interior of West Africa; "Ethiopian" was used in the geographies of the time for Black people in general.
