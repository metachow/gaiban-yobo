head_zh: 亚玛钻（亚马孙）
head_en: Amazone (Amazonia)
zh: |
  亚玛钻（亚马孙）〔得名于亚洲靠近北高海（里海）之处的一个名称〕[^1]此国北与拂兰西（法国）为亚那（圭亚那）相连，东与伯西儿（巴西）为界，南邻マツトゴロス（马托格罗索），西接孛露（秘鲁）。土地广大，山岳占十之八九。没有所谓国主，风俗卑贱，由野人中的强者分据各处。国中有一条大河，称为亚玛钻河，出产大鱼。当地人以捕鱼为业，从中获利。此地的妇人强壮，胜过男子。西洋人初到此地，见妇人勇猛，与古时亚玛钻国的妇人一样刚强，所以用这个名称来称呼。后来当地人也跟着使用，成为国名。气候极为炎热。西洋人见此地不毛，并不去占领。北极出地三度至十八度。
en: |
  Amazone (Amazonia) 〔after a name found in Asia, near the Caspian Sea〕.[^1] The north of this country is continuous with Goiana (Guiana) of Furansu (France); to the east it borders on Purajiru (Brazil), to the south it neighbours Mattogorosu (Mato Grosso), and to the west it adjoins Pēri (Peru). The land is vast, and mountains take up eight or nine parts in ten of it. There is none called a ruler of the country, and the customs are lowly; among the savages there are strong men, who divide the land among them and hold it in separate parts. In the country there is a great river called the Amazone, which produces large fish. The natives make fishing their occupation and gain their profit from it. The women of this land are strong, and surpass the men. When the Westerners first came to this land and saw how fierce the women were, they named it so, because they were as forceful and powerful as the women of the Amazone country of old. Later the natives too took it up, and it became the name of the country. The climate is extremely hot. When the Westerners saw that this land was barren, they did not venture to take it. The pole stands three to eighteen degrees above the horizon.
notes_zh:
  - 亚马孙女战士是希腊神话中居于黑海、高加索一带的女战士部族。1541—1542年奥雷利亚纳顺此河而下，自称遇见女战士，河与地区遂得此名；其事出于传说。
notes_en:
  - The Amazons are the legendary warrior women of Greek myth, placed around the Black Sea and the Caucasus. When Orellana descended this river in 1541–1542 he claimed to have met women warriors, and the river and region took the name; the story is a legend.
