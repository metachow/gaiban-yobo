head_zh: 琉球
head_en: Ryūkyū
zh: |
  琉球〔古称龙宫，中古称流求[^1]〕又称琉球。是位于日本萨州以南三百余里的海岛。其人与朝鲜人相似而又有别。此国尊崇神、儒、佛三道，学习日本风俗，精通技艺的人也很多。向我皇国入贡称臣。四季气候温暖，冬月很少见雪。北极出地二十五六度。
en: |
  Ryūkyū (Ryukyu) 〔anciently Ryūgū, in the middle ages Ryūkyū[^1]〕 is also written Ryūkyū. It is an island in the sea more than three hundred *ri* south of Satsuma in Japan. The people resemble the Koreans and yet differ from them. This country honours the three ways of Shintō, Confucianism and Buddhism, follows the customs of Japan, and has many people who are well versed in the arts and crafts. It sends tribute to our Imperial Land and is subject to it. The climate of the four seasons is warm, and snow is seldom seen in the winter months. The pole stands twenty-five or twenty-six degrees above the horizon.
notes_zh:
  - 龙宫、流求、琉球三者，原文都读作“リウキウ”（Ryūkyū）。
notes_en:
  - The original reads all three, 竜宮, 流求 and 琉球, as Ryūkyū.
