head_zh: 序
head_en: Preface
zh: |
  外蕃容貌图画序

  主宰天的，称为太极[^1]。它不言不语，而四季交替运行，万物生长发育。昼夜一百刻、十二时之间，周天旋转三百六十度。天有三道，即所谓赤道线和南北黄道线[^2]。无论何地，从明六时到昏六时，称为地平，其间为一百八十度，譬如在团子上穿了一根签子。赤道线是天的中心，太阳到达这里，便是春分、秋分的彼岸。太阳到达南北黄道，便是冬至、夏至。两者相距四十七度。

  天上又有南北二极星，为航海的人提供便利，称为枢星。北极出地九十度之地，是长夜之国、冰海，人不能居住。我朝和支那等处于二十五六度至四十度之地，称为正带。西洋、非洲、南天竺[^3]、爪哇、南美洲等在赤道正下方，是炎热之国，气候热得河川如同沸汤，称为暖带。其气候偏颇，据说远不及正带之国[^4]。

  而且地球四面八方都有人居住。俗话说“三山六海一平地”[^5]。异邦人建造大船，航行到各国，以交易为业，因此自然知道万国的风俗。我朝独立建国，是丰饶之国，所以不航海到异邦，因此不知万国之广大、尤其不知其风俗的人很多。人们只听说异邦人叫“唐人”，便这样记住，这也并非全无道理。上古有遣唐使，学习书籍，又带回许多珍奇之物；因为受过恩惠，不知从谁开始，便称之为“唐人”，大概是这个意思。然而后人误用，无论哪国的异邦人，都一概称为“毛唐人”了[^6]。

  全世界分为五大洲，即所谓亚洲、欧洲、非洲、南美洲、北美洲。尤其是非洲的西岛、圣多默、福岛等，据说正位于日本的正下方[^7]。这就是“合国”[^8]。

  反过来从那边看这边，也是如此。然而不留心天文地理的人，无法研究其中的道理。各大洲之内分为数国，各国有其本地的风俗；这里特地选取其中有名的国家和岛屿，略加图画，使人坐着便能观览，易如反掌。兵法说：“知彼知己，百战不殆。”此书也要让妇女儿童观看。此外，依据《坤舆图识》《地学正宗》《外蕃译史》等数部书[^9]，著成《外蕃容貌图画》，分为乾、坤二册，以展示各国的气候与风俗。序言如上。
en: |
  Preface to *Illustrated Appearances of Foreign Peoples*

  That which presides over heaven is called the Great Ultimate.[^1] It does not speak, yet the four seasons proceed in turn and the ten thousand things are born and grow. In the hundred quarter-hours and twelve double-hours of day and night, the heavens turn through three hundred and sixty degrees. Heaven has three paths, the so-called equatorial line and the northern and southern ecliptic lines.[^2] In whatever place, from six in the morning to six in the evening is called the horizon; this span is one hundred and eighty degrees. It is as if a skewer were passed through a round dumpling. The equatorial line is the centre of heaven, and when the sun reaches it, it is the *higan* of the spring and autumn equinoxes. When it reaches the northern and southern ecliptic lines, it is the winter and summer solstices. The distance between them is forty-seven degrees.

  In heaven there are also the two pole stars, north and south, which give convenience to men who sail the seas; they are called the pivot stars. A place where the north pole stands ninety degrees above the horizon is a land of night, an icy sea, and men cannot live there. Our realm, Shina and others lie between twenty-five or twenty-six degrees and forty degrees, and this is called the temperate zone. The West, Africa, southern Tenjiku (India),[^3] Java, South America and the like lie directly under the equator and are hot countries, with a climate in which the rivers boil; this is called the warm zone. Their climate is extreme, and they are said to be far inferior to the countries of the temperate zone.[^4]

  Moreover, men dwell in all eight directions of the globe. The proverb says, "Three parts mountain, six parts sea, one part plain."[^5] Men of foreign lands build great ships and sail to many countries, making trade their business, and so they come naturally to know the customs of the ten thousand countries. Our realm stands independent as a land of plenty, and so it does not send ships to foreign lands; as a result many do not know the vastness of the ten thousand countries, and above all their customs. They have heard of foreigners only as *Tōjin*, "men of Tang", and remembered them so, and this is not without some reason. In ancient times there were embassies to the Tang, books were learnt there, and many rare things were brought back; because of the kindness received, someone, no one knows who, must have begun to say *Tōjin* in this sense. Later generations, however, mistakenly came to call every foreigner whatever only *ketōjin*, "hairy men of Tang".[^6]

  The whole world is divided into five continents, the so-called Asia, Europe, Africa, South America and North America. In Africa in particular, Nishijima, São Tomé, Fukushima and others are said to lie directly beneath Japan.[^7] This, then, is the united country.[^8]

  Again, seen from there, this is also so. But those who have no inclination for astronomy and geography cannot study its principles. Each continent is divided into several countries, and each country has the customs of its own land. Here the famous countries and islands in particular are pictured a little, so that, sitting where one is, one may look upon them as if turning over the palm of the hand. The art of war says, "Know the enemy and know yourself, and in a hundred battles you will not be in peril." Let women and children also be shown them. In addition, basing myself on several books, the *Kon'yo zushiki*, the *Chigaku seisō*, the *Gaiban yakushi* and others,[^9] I have compiled the *Illustrated Appearances of Foreign Peoples* in the two volumes Ken and Kon (Heaven and Earth), to show their climates and customs. That is all.
notes_zh:
  - 原文作“大極”，当为“太極”（见校记）。
  - 赤道线是天球赤道；这里的“南北黄道线”所指实为南北回归线（各距赤道约二十三度半，故相距“四十七度”）。
  - 原文作“天笠”，当为“天竺”（见校记）。
  - 原文“気候偏倖にして正帯の國なり遥に劣れめと云”文字有讹（见校记）：“偏倖”当为“偏僻”，“なり”“れめ”似为“より”“れり”之误。今据文意译出，存疑。
  - 谚语，大意是说地面上山占三、海占六、平地占一。
  - 毛唐人（けとうじん）：日本人对外国人带轻蔑的称呼，意为“毛茸茸的唐人”。
  - 西岛、圣多默（São Tomé）、福岛（耶稣会士地图上的“幸运群岛”，即加那利群岛）：这是说非洲西部的这些岛屿，与日本互为对跖；“西岛”未详。
  - “合国”意未详，疑指与日本相对的“对跖之国”；存疑。
  - 《坤舆图识》为箕作省吾所著（1845），《地学正宗》为杉田玄端所著（1851）；《外蕃译史》未能查到此名之书。
notes_en:
  - The original writes 大極 for 太極 (see the textual notes).
  - The equatorial line is the celestial equator; the "northern and southern ecliptic lines" here are in fact the tropics of Cancer and Capricorn, each about twenty-three and a half degrees from the equator, hence the "forty-seven degrees" between them.
  - The original writes 天笠 for 天竺 (see the textual notes).
  - "The text is corrupt here (see the textual notes): 偏倖 is probably for 偏僻 \"extreme\", and なり … 劣れめ for より … 劣れり \"inferior to\". The translation follows this reading and is uncertain."
  - A proverb, meaning roughly that on the face of the earth mountains make up three parts, sea six, and plain one.
  - "*Ketōjin*: a contemptuous Japanese word for foreigners."
  - Nishijima, São Tomé (聖多黙) and Fukushima, the 'Fortunate Isles' of the Jesuit maps, that is the Canaries; the sense is that these western African islands lie at the antipodes of Japan. Nishijima is not identified.
  - The meaning of 合國 is unclear; perhaps the 'opposite country' at the antipodes is meant. Uncertain.
  - "*Kon'yo zushiki* is by Mitsukuri Shōgo (1845); *Chigaku seisō* is by Sugita Gentan (1851); no book of the title *Gaiban yakushi* has been found."
