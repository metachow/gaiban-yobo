head_zh: 刊记
head_en: Colophon
zh: |
  此外，下一编将详细考证万国船只的图画，并附上船的印记，画得一看便知是哪一国的船；又将从日本到万国的里数全部标出，追加刻印出版。

  安政二年[^1]乙卯正月吉日。

  田川春道撰；仓田东岳画。

  制本发行：金华堂　须原屋佐助（日本桥通四丁目）。

  东都书林：须原屋茂兵卫（日本桥通一丁目）；山城屋佐兵卫（同二丁目）；小林新兵卫（同上）；冈田屋嘉七（芝神明前）；和泉屋吉兵卫（同）；内野屋弥平治（同）；播摩屋胜五郎（日本桥通十轩店）；和泉屋善兵卫（本町三丁目）；丁子屋平兵卫（大传马町二丁目）；出云寺万治郎（横山町一丁目）；和泉屋金右卫门（同三丁目）；须原屋伊八（浅草茅町二丁目）；冈村屋庄助（下谷池之端仲町）；英文藏（同御成街通）；纸屋德八（同）。
en: |
  Furthermore, in the next volume we shall investigate in full the pictures of the ships of all countries, add the ships' marks, draw them so that one can tell at a glance to which country a ship belongs, and print all the distances in *ri* from Japan to all countries, and publish this as a supplementary engraving.

  Ansei 2,[^1] the year *kinoto-u* (1855), first month, an auspicious day.

  Compiled by Tagawa Harumichi; pictures by Kurata Tōgaku.

  Binding and sale: Kinkadō, Suharaya Sasuke (Nihonbashi-dōri 4-chōme).

  Booksellers of the Eastern Capital: Suharaya Mohei (Nihonbashi-dōri 1-chōme); Yamashiroya Sahei (the same, 2-chōme); Kobayashi Shinbei (the same); Okadaya Kashichi (Shiba Shinmei-mae); Izumiya Kichibei (the same); Uchinoya Yaheiji (the same); Harimaya Katsugorō (Nihonbashi-dōri Jikkendana); Izumiya Zenbei (Hon-chō 3-chōme); Chōjiya Heibei (Ōdenma-chō 2-chōme); Izumoji Manjirō (Yokoyama-chō 1-chōme); Izumiya Kin'emon (the same, 3-chōme); Suharaya Ihachi (Asakusa Kayachō 2-chōme); Okamuraya Shōsuke (Shitaya Ikenohata Nakachō); Eibunzō (the same, Onari-kaidō); Kamiya Tokuhachi (the same).
notes_zh:
  - 安政二年即1855年。
notes_en:
  - Ansei 2 is 1855.
