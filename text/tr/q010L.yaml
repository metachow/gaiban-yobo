head_zh: 朝鲜
head_en: Chōsen (Korea)
zh: |
  朝鲜〔分为马韩、辰韩、弁韩〕古称三韩。中古〔分为新罗、百济、高丽〕成为三国，后又合而称朝鲜。分为八道，有大县三十三、小县一百二十八。此国北以兀良哈（朝鲜东北的女真地区）[^1]为界，东与女直[^2]相接，南以釜山浦为限，与日本九州相对，西与支那及满洲陆地相连。中部有鸭绿江[^3]，都府称京（汉城，今首尔）。国王臣服于汉土（中国），又属于我皇国。人民柔和，通晓汉字。四季气候与日本关东相同。北极出地三十六度至三十八度。
en: |
  Chōsen (Korea) 〔divided into Mahan, Jinhan and Byeonhan〕 was anciently called the Three Han. In the middle ages 〔divided into Silla, Paekche and Koryŏ〕 it became three kingdoms, which were later joined together and called Chōsen. It is divided into eight circuits, with thirty-three large districts and one hundred and twenty-eight small ones. To the north the country borders on Orankai (the Jurchen lands northeast of Korea),[^1] to the east it continues into the land of the Jochoku (the Jurchen),[^2] to the south it ends at Fusanho (Busan), facing Kyūshū of Japan, and to the west it is joined by land to Shina and Manchuria. In its middle part lies the Ōryokukō (the Yalu River),[^3] and the capital is called Kei (Kyŏng, that is Hanseong, now Seoul). The king is a subject of China (Kara) and also belongs to our Imperial Land. The people are gentle and well able to understand Chinese characters. The climate of the four seasons is the same as that of the Kantō in Japan. The pole stands thirty-six to thirty-eight degrees above the horizon.
notes_zh:
  - 兀良哈（ヲランカイ）：日本人对朝鲜东北、女真人居住地区的称呼，大致即 Uriankhai（兀良哈）。
  - 女直即女真。
  - 鸭绿江实为朝鲜与中国的北界，并不在“中部”。
notes_en:
  - "Orankai: the Japanese name for the Jurchen country northeast of Korea, roughly the Uriankhai of Chinese sources."
  - Jochoku (女直) is the same as Jurchen (女真).
  - The Yalu in fact forms the northern boundary of Korea, not a river of the "middle part".
