head_zh: 依兰上（冰岛）
head_en: Iisurando (Iceland)
zh: |
  依兰土（冰岛）[^1]〔译作“冰地”〕此国是位于诺尔勿惹亚（挪威）以北的海岛，隶属第那玛尔加（丹麦）。其人卑贱，性情温柔。此地的人聚集鱼骨建造房屋。近世国内建立学校，教导学生。气候极为寒冷，最冷的时候，把水撒向空中，水在落到地上之前便全都结成冰落下。当地人以捕鱼捉鸟为业。北极出地六十三度至六十七度。
en: |
  Iisurando (Iceland)[^1] 〔translated, "Land of Ice"〕. This country is a sea island to the north of Norueshia (Norway) and belongs to Dēnemaruka (Denmark). The people are lowly, and gentle by nature. In this land they gather fish bones and make houses. In recent times schools have been built in the country, and students are taught. The climate is extremely cold; in the worst times, if one takes water and throws it up into the air, all of it turns to ice before it reaches the ground, and falls as ice. The natives make their living by catching fish and birds. The pole stands sixty-three to sixty-seven degrees above the horizon.
notes_zh:
  - 此页图中标题作“依蘭上”，正文作“依蘭土”（校记）；“上”当为“土”之误。
notes_en:
  - The label of the figure reads 依蘭上 and the text 依蘭土 (see the textual notes); 上 is a slip for 土. The reading is *Iisurando* here and *Eisurando* on the Denmark page.
