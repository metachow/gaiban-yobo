head_zh: 墨是可（墨西哥）
head_en: Mekishiko (Mexico)
zh: |
  墨是可（墨西哥）〔一名新伊斯把泥亚（新西班牙）〕北邻新墨是可（新墨西哥），东与合众国为界，南至把那麻（巴拿马），西以东红海[^1]为限。部中有三大镇，其都城称墨西哥。此地繁盛，富商最多。又有大政府，由伊斯把泥亚（西班牙）派驻长官（奉行）[^2]。其人聪明伶俐，尤为温顺。气候海边湿热，内地温和。物产众多，以稻米与白银为最上，是十分富饶之地。北极出地九度至二十度。
en: |
  Mekishiko (Mexico) 〔also called Shin'isuhania (New Spain)〕. To the north it neighbours Shinmekishiko (New Mexico), to the east it borders on the United States, to the south it reaches Panama, and to the west it is limited by the Eastern Red Sea.[^1] There are three great governorates in the country, and its capital is called Mexico. This place is prosperous, and wealthy merchants are very numerous. There is also a great seat of government, and Isubania (Spain) has placed a governor (*bugyō*) there.[^2] The people are clever and quick-witted, and especially gentle. As to climate, the seaside is damp and hot, and the interior is good and mild. The products are many, and rice and silver are the best of them; it is a very rich land. The pole stands nine to twenty degrees above the horizon.
notes_zh:
  - 东红海：或指加利福尼亚湾（“朱红海”），实际上墨西哥西面是太平洋。
  - 墨西哥已于1821年脱离西班牙而独立；此处沿用旧说。
notes_en:
  - "The Eastern Red Sea: probably the Gulf of California (the \"Vermilion Sea\"); in fact the Pacific lies to the west of Mexico."
  - Mexico became independent of Spain in 1821; the author follows an older source.
