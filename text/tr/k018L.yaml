head_zh: 新尾辣那达（新格拉纳达）
head_en: Shingaranada (New Granada)
zh: |
  新尾辣那达（新格拉纳达）。此国北以カライビス海（加勒比海）为限，东接〔和兰（荷兰）领〕为亚那（圭亚那）、〔英吉利（英国）领〕为亚那、〔拂兰西（法国）领〕为亚那及孛露（秘鲁），西达大南海。全国有三大镇，八省府，其都城称ポルトベルロ（波托韦洛）[^1]。此地极为繁盛，世人称之为世界第一的市场。古时有独立的小王，近世被诸国吞并，后来归荷兰所有。其人天资勇猛，风俗卑贱，当地人多半裸体，面色极黑。气候总体炎热，但海风与陆风交替吹拂，稍得缓和。五谷成熟良好，然而多山川旷野，也有供给不足之处。北极出地二度至十度。
en: |
  Shingaranada (New Granada). To the north this country is bounded by the Karaibisu Sea (the Caribbean); to the east it adjoins Goiana (Guiana) 〔possession of Oranda (Holland)〕, Goiana 〔possession of Igirisu (England)〕, Goiana 〔possession of Furansu (France)〕 and Pēri (Peru); to the west it reaches the Great South Sea. The whole country has three great governorates and eight provincial capitals, and its capital is called Porutoberuro (Portobelo).[^1] This place is exceedingly prosperous, and the world calls it the first market of the world. In ancient times there was an independent petty king; in recent times it was annexed by various states, and later became the possession of Holland. The people are by nature brave and fierce, and their customs are lowly; the natives are mostly naked, and their faces are extremely black. The climate is hot throughout, but sea breezes and land breezes alternate and bring a little mildness. The five grains ripen well, but there are many mountains, rivers and wild plains, and there are places where the harvest does not suffice. The pole stands two to ten degrees above the horizon.
notes_zh:
  - 波托韦洛在今巴拿马，原属西班牙。原文说此国后来归荷兰所有，与史实不合。
notes_en:
  - Portobelo lies in present Panama and belonged to Spain; the statement that the country later became Dutch does not agree with the facts.
