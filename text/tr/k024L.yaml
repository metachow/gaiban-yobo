head_zh: 卧儿狼德（格陵兰）
head_en: Guruururando (Greenland)
zh: |
  卧儿狼德（格陵兰）。此国一半延伸到冰原，详情不明，一半突出于冰海。境内自南至北有大冰山，人迹不能到达。其人天资卑贱，愚直。常携带弓箭和鱼叉，远近往来，以渔猎为业。妇人身裹兽皮，所以看上去几乎和男子一样。气候极为寒冷，不产五谷；北风吹时尤为寒冷，西风吹时稍暖。到了冬月，太阳的光线微弱，即使是白天也如同薄暮。北极出地六十度至八十度。
en: |
  Guruururando (Greenland). Half of this country extends into icy wastes of which nothing certain is known, and half juts out into the Arctic Ocean. In the region a great ice mountain runs from south to north, and human tracks cannot reach it. The people are by nature lowly and simple. They constantly carry bows and arrows and harpoons and spears, go far and near, and make fishing and hunting their occupation. The women wrap their bodies in the skins of beasts, and so are almost like men. The climate is extremely cold and the five grains are not produced; when the north wind blows it is especially severe, and when the west wind blows it is a little warmer. When winter comes the light of the sun is faint, and even at midday it is like dusk. The pole stands sixty to eighty degrees above the horizon.
