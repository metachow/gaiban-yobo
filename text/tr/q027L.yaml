head_zh: 暎咭唎（英国）
head_en: Igirisu (England)
zh: |
  大貌利答尼亚（大不列颠）〔一名暎咭唎（英国）[^1]〕是位于和兰（荷兰）、佛兰西（法国）等西面海中的两个岛的总称。此国北以スコシア海（苏格兰以北之海）为限，东以北海为限，南以カナール（英吉利海峡）为限，西临亚太腊海（大西洋）。全国分为三部〔英吉利（英格兰）、思可齐亚（苏格兰）、意而兰太（爱尔兰）等〕，又分为五十二州，其中有六十二侯，都臣服于国王。大都府称龙动（伦敦），其繁盛程度，西洋各国无可相比。府中有大河，名为爹摸斯（泰晤士河），河上架有奇巧之桥，长一百八十丈，宽四丈余[^2]。夜间桥上点起几座灯火，方便夜里往来。其人勇壮，性情又不宽厚，极好报复怨恨。当地人制造多种奇巧之物。气候寒暖适中，宜于人居。北极出地五十度至五十八度。
en: |
  Great Buritania (Great Britain) 〔also called Igirisu (England)[^1]〕 is the general name of two islands lying in the western sea beyond Oranda (Holland), Furansu (France) and the rest. To the north this country is limited by the Sukoshia Sea (the sea north of Scotland); to the east it is limited by the North Sea; to the south it is limited by the Kanāru (the Channel); to the west it faces the Atlantic. The whole country is divided into three parts 〔Engerando (England), Shieshia (Scotland), Irurando (Ireland) and so on〕, and again into fifty-two provinces, among which there are sixty-two lords, all of them subjects of the king. The great capital is called Rondon (London), and its prosperity is such that nothing in the provinces of the West can be compared with it. In the city there is a great river called Dēmusu (the Thames), over which a bridge of marvellous workmanship is laid, one hundred and eighty *jō* long and more than four *jō* wide.[^2] At night several lamps are lit on the bridge for the convenience of those who pass to and fro in the dark. The people are brave and sturdy, and their nature is not generous; they are very deeply given to repaying a grudge. The natives produce several kinds of ingenious things. The climate, both in cold and in warmth, is temperate and agreeable to men. The pole stands fifty to fifty-eight degrees above the horizon.
notes_zh:
  - 暎咭唎：本为“英吉利”（England）的另一种音写，书中常用来指整个不列颠；其下割注“英吉利”则指英格兰本身。
  - 丈：日本的一丈约三米，故桥长约五百四十米。
notes_en:
  - Igirisu (暎咭唎) is another transcription of the name England; the book often uses it for the whole of Britain, whereas 英吉利 in the small note below means England proper.
  - A *jō* is about three metres, so the bridge is given as about 540 metres long.
