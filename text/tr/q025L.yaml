head_zh: 佛兰西（法国）
head_en: Furansu (France)
zh: |
  佛兰西（法国）。此国北以カナール（英吉利海峡）[^1]及和兰（荷兰）为界，东接独逸都（德意志）、赫尔勿亚（瑞士）、意太里亚（意大利），南邻地中海及以西波尼亚（西班牙），西以亚太腊海（大西洋）为限。全国分为八十六州[^2]，其都府称把理斯（巴黎）。其人聪明伶俐，颇有礼节，又勇壮好战，兵威极盛。气候北部寒冷，南部温暖。此国东南多山岳，其余是平地，能出产各种物产，富饶。北极出地四十二度至五十度。
en: |
  Furansu (France). To the north this country borders on the Kanāru (the Channel)[^1] and on Oranda (Holland); to the east it touches Doitsu (Germany), Herushia (Switzerland) and Itaria (Italy); to the south it adjoins the Mediterranean and Isubania (Spain); to the west it is limited by the Atlantic. The whole country is divided into eighty-six provinces,[^2] and its capital is called Harēsu (Paris). The people are clever and quite courteous, and also brave and fond of war, and their military power is very great. As to climate, the northern parts are cold and the southern parts warm. In the southeast of this country there are many mountains and the rest is level land; it produces all kinds of things well and is rich. The pole stands forty-two to fifty degrees above the horizon.
notes_zh:
  - カナール：荷兰语 Kanaal（海峡），即英吉利海峡。
  - 八十六州：当指法国的八十六个省（département）。
notes_en:
  - "Kanāru: the Dutch *Kanaal*, the English Channel."
  - The eighty-six provinces are evidently the eighty-six *départements* of France.
