head_zh: 台湾
head_en: Daiwan (Taiwan)
zh: |
  大宛[^1]〔旧称荅加沙古[^2]，中古称东宁〕又称台湾。是在汉土（中国）厦门东南七十余里的海岛。其人极为卑贱，常裸体，以山中狩猎为业，住在山里，所以称为山童。海边的渔人更为低贱。此国原无文字，愚昧无知，所以兰人（荷兰人）占据了它。我皇国宽文年间[^3]，明朝的国姓爷驱逐了荷兰人，改称东宁。近世属于清，其府称台湾府。唐土之人移居以后，除渔人、猎人之外，学习中华风俗礼仪的人也很多。四季温暖，冬月不降霜雪。此地西南部农民耕田，一年收两次米、粟。是南北长一百二十里的大岛。北极出地二十度至二十三度。
en: |
  Daiwan[^1] 〔formerly Takasago,[^2] in the middle ages Tōnei〕 is also called Daiwan (Taiwan). It is an island in the sea more than seventy *ri* southeast of Yamon (Amoy) in China (Kara). The people are extremely base; they go always naked, make a living by hunting in the mountains and dwell in the mountains, and so they are named *sandō*, mountain children. The fishermen of the sea coast are baser still. This country originally had no writing and was ignorant and dull, and for that reason the people of Oranda (Holland) seized it. In the Kanbun era of our Imperial Land,[^3] Kokuseiya (Koxinga) of the Ming drove them out and changed the name to Tōnei. In recent times it has belonged to the Qing, and its prefecture is called Taiwan Prefecture. Since people of China (Kara) settled there, apart from the fishermen and hunters, many have taken up the manners of the Central Flower. The four seasons are warm, and in the winter months neither frost nor snow falls. In the southwestern part of the land the farmers till the fields and gather rice and millet twice a year each. It is a great island one hundred and twenty *ri* from north to south. The pole stands twenty to twenty-three degrees above the horizon.
notes_zh:
  - 原文开头写作“大宛”，读音为“ダイワン”（Daiwan）；应是“臺灣”的音写之误。大宛本为中亚古国名。图中标题作“臺灣”。
  - 荅加沙古（タカサゴ）：日本人对台湾的旧称。
  - 宽文（1661—1673）。国姓爷即郑成功，1662年自荷兰人手中夺取台湾。
notes_en:
  - The text opens with 大宛, read Daiwan, which is evidently a mistaken writing for 台湾; Dayuan is properly an ancient state of Central Asia. The figure label has 臺灣.
  - "Takasago: the old Japanese name for Taiwan."
  - Kanbun is 1661–1673. Kokuseiya is Zheng Chenggong, who took Taiwan from the Dutch in 1662.
