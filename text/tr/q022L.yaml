head_zh: 天竺（印度）
head_en: Tenjiku (India)
zh: |
  天竺[^1]〔一名印度〕此地是亚洲的一大部分，是总称。北以图伯特（西藏）为界，东接汉土（中国），南以齐狼（锡兰）及诸岛、印度洋为限，西邻百儿西亚（波斯），中部以安日河（恒河）[^2]的东西分为前后二大部。又分为数国，各国之主自称为王，其始是古时的莫卧儿帝。近年暎咭唎（英国）、佛兰西（法国）、和兰（荷兰）、波尔杜尾尔（葡萄牙）、弟那玛尔加（丹麦）等国前来占据印度各地，于是当地人分成了两部分。其人虽各不相同，但天性聪慧，与人交往重情谊，又喜好读书和技艺。气候北部寒冷，南部极热，所以山林四季常绿。土地肥沃，五谷一年两熟。北极出地八度至三十二度。
en: |
  Tenjiku[^1] 〔also called Indo (India)〕. This land is one great division of the continent of Asia and is a general name. To the north it borders on Chipetto (Tibet), to the east it touches China (Kara), to the south it is limited by Seiron (Ceylon), the islands and the Indian Ocean, and to the west it adjoins Perushia (Persia); in the middle it is divided into two great parts, a front and a rear, by the east and west of the river Anjitsu (the Ganges).[^2] It is further divided into several countries, and the lord of each calls himself king. Of these the Mongoru (Mughal) emperor of old was the first. In recent years Igirisu (England), Furansu (France), Oranda (Holland), Horutogaru (Portugal), Dēnemaruka (Denmark) and others have come and seized the lands of India. On this the people of the country became divided into two. The people are of various kinds, but by nature they are intelligent, kindly in their dealings, and fond of reading and of the arts and crafts. As to climate, the north is cold and the south extremely hot, so that mountains and forests have green leaves in all seasons, the soil is fertile, and the five grains ripen twice a year. The pole stands eight to thirty-two degrees above the horizon.
notes_zh:
  - 原文作“天笠”，当为“天竺”（见校记）。
  - 安日河：耶稣会士地图上对恒河的称呼。所谓前后二大部，即恒河以西的“前印度”与以东的“后印度”。
notes_en:
  - The original writes 天笠 for 天竺 (see the textual notes).
  - Anjitsu is the Jesuit-map name of the Ganges. The two great parts are Hither India, west of the Ganges, and Further India, east of it.
