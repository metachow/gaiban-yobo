head_zh: 独逸都（德意志）
head_en: Doitsu (Germany)
zh: |
  独逸都（德意志）〔窝窝斯甸礼畿（奥地利），即德意志帝的本国〕[^1]此国北以窝窝斯甸海（波罗的海）、第那玛尔加（丹麦）及北海为限，东与孛漏生（普鲁士）及奥地利为界，南接アトリアチス海（亚得里亚海）、意太里亚（意大利）及赫尔勿萋亚（瑞士），西邻拂兰西（法国）及和兰（荷兰）。分为上下二大部，共十道。此邦是欧洲正统的帝国，有数十位王侯前来朝宗。其大都城号称勿能（维也纳）。其人风俗并不卑贱，对长者敬礼极为恭谨。礼乐盛行，喜好学术，笃信而无疑心；又勇壮，熟习兵事。气候暖和，诸种物产丰盛，极为富裕丰饶。北极出地五十一度至五十五度。又据说，我皇国元应二年[^2]，德意志国有一位僧官，名叫援尔独儿度（贝托尔德），发明了炮术，这大概就是炮术的起源。
en: |
  Doitsu (Germany) 〔Oosutenreiki (Austria), the home country of the German emperor〕.[^1] To the north this country is bounded by the Oosuten Sea (the Baltic), Dēnemaruka (Denmark) and the North Sea; to the east it borders on Furoisen (Prussia) and Austria; to the south it joins the Atoriachisu Sea (the Adriatic), Itaria (Italy) and Heruheshia (Switzerland); to the west it adjoins Furansu (France) and Oranda (Holland). It is divided into an upper and a lower great part, ten circuits in all. This country is the legitimate empire of Europe, and several tens of kings and princes come to pay court to it. Its great capital is called Ueinen (Vienna). The customs of the people are not base, and their respect for their elders is truly deep. Rites and music flourish, they love learning, they are firm in belief and without doubt; they are also brave and well versed in military affairs. The climate is mild, all kinds of produce abound, and the country is very rich and plentiful. The pole stands fifty-one to fifty-five degrees above the horizon. It is also said that in the second year of Gen'ō of our Imperial Land[^2] a monk-official of Germany called Harutorudo (Berthold) invented the art of the gun; this is perhaps the very origin of that art.
notes_zh:
  - 此页标题作“独逸都”（德意志），所述却主要是奥地利（ヲヽステンレイキ，荷兰语 Oostenrijk）：割注称奥地利为德意志帝的本国，下文的邻国、都城（维也纳）亦属奥地利。
  - 元应二年即1320年。贝托尔德（施瓦茨）是传说中的火药发明者，其事迹不确，火药在欧洲的出现亦早于此。
notes_en:
  - "The page is headed Germany but mostly describes Austria (*Oostenrijk* in Dutch, Oosutenreiki): the small note calls it the home country of the German emperor, and the neighbours and the capital (Vienna) that follow are Austria's."
  - Gen'ō 2 is 1320. Berthold (Schwarz) is the legendary inventor of gunpowder weapons; he is not a certain historical figure, and gunpowder was known in Europe earlier.
