head_zh: 马拿莫太巴（莫诺莫塔帕）
head_en: Monomotappa (Monomotapa)
zh: |
  马拿莫太巴（莫诺莫塔帕）。此国西北与曷布尔兰土（卡弗拉里亚）为界，东隔海与麻打曷矢加（马达加斯加）岛相对，南以大南海为限。全国的首府称ソハラ（索法拉）。其人粗野鄙陋。气候炎热，境内大量出产谷物，土地肥沃丰饶。南极出地十一度至二十度。
en: |
  Monomotappa (Monomotapa). The northwest of this country borders on Kaffururando (Kaffraria); to the east it is separated by sea from the island of Matakasuka (Madagascar); to the south it is limited by the Great South Sea. The chief city of the whole country is called Sohara (Sofala). The people are rustic. The climate is hot, grain is produced in great quantities in its parts, and the land is fertile and abundant. The south pole stands eleven to twenty degrees above the horizon.
