head_zh: 新思可齐亚（新斯科舍）
head_en: Shinsukoshikia (Nova Scotia)
zh: |
  新思可齐亚（新斯科舍）。此国北与ブレトン岛（布雷顿角岛）为界，东以大北海为限，南邻合众国的ボストン（波士顿），西与新ブロンス（新不伦瑞克）陆地相连。全国分为七州，其首府称ハルリハキス（哈利法克斯）。隶属于暎咭唎（英国）。其人风俗不一，多是西洋人种。气候总体寒冷，早晚有大雾，夏月则炎热。地势颇高，能出产各种谷物。北极出地三十六度至四十七度。

  外蕃容貌图画终。
en: |
  Shinsukoshikia (Nova Scotia). To the north this country is bounded by Bureton Island (Cape Breton Island), to the east it is limited by the Great Northern Sea, to the south it neighbours Bosuton (Boston) of the United States, and to the west it is continuous by land with Shinburonsu (New Brunswick). The whole country is divided into seven provinces, and its chief city is called Harurihakisu (Halifax). It belongs to Igirisu (England). The customs of the people are not uniform, and they are mostly of Western race. The climate is cold throughout, with great fogs morning and evening, and the summer is hot. The land is rather high and raised, and produces all kinds of grain well. The pole stands thirty-six to forty-seven degrees above the horizon.

  End of the *Gaiban yōbō zuga*, "Illustrated Appearances of Foreign Peoples".
