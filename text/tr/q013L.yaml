head_zh: 兀良哈（朝鲜东北的女真地区）
head_en: Orankai (the Jurchen lands northeast of Korea)
zh: |
  兀良哈（朝鲜东北的女真地区）是满洲的一部分，属于女直。此国北以鲁西亚（俄罗斯）领地为界，东与哈喇土（库页岛）[^1]、山丹[^2]及日本海相隔，西南与朝鲜相邻，相距甚近。其人与朝鲜人相似而又有别。四季寒冷，北极出地四十二度至四十五度。
en: |
  Orankai (the Jurchen lands northeast of Korea) is a part of Manchuria and belongs to the Jochoku (the Jurchen). To the north this country borders on the territory of Roshia (Russia); to the east it is separated by Karafuto (Sakhalin),[^1] Santan[^2] and the Sea of Japan; to the southwest it adjoins Korea, very close to it. The people resemble the Koreans and yet differ from them. It is a cold land in all four seasons. The pole stands forty-two to forty-five degrees above the horizon.
notes_zh:
  - 哈喇土（カラフト）：即库页岛（萨哈林）。
  - 山丹：指黑龙江下游一带及其居民。
notes_en:
  - Karafuto is Sakhalin.
  - Santan denotes the lower Amur region and its people.
